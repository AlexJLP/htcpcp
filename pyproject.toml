[project]
name = "Covefe"
version = "0.1.0"
description = "HTCPCP hardware controller dashboard and server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.38.6",
    "uvicorn[standard]>=0.30.6",
    "h11>=0.14.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "PyYAML>=6.0.1",
    "Pillow>=10.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]
pi = [
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "rpi-lgpio>=0.6; sys_platform == 'linux'",
    "luma.oled>=3.11.0; sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter / ignored for long lines)
]
